name: Build
on:
  workflow_run:
    workflows: ["Security Audit"]
    types: [completed]
    branches: [master, fix/*, feature/*]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # ONLY required when a problem building and mistmaching dependencies occurs
      # - name: Clean node_modules and lockfile
      #   run: |
      #     rm -rf node_modules
      #     rm -f pnpm-lock.yaml
      #     rm -rf packages/*/node_modules

      - name: Install dependencies
        # Remmove the --frozen-lockfile flag when running the clean step above
        # run: pnpm install
        run: pnpm install --frozen-lockfile

      # Turbo handles internal caching and dependencies
      - name: Build with Turbo
        run: pnpm run build

      # Cache the entire workspace for other workflows
      - name: Cache workspace
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            packages/*/dist
            apps/*/build
          key: workspace-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
