name: Quality Pipeline

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [master]

jobs:
  quality:
    name: Test and Lint
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        task: [test:coverage, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: true
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: ".bun-version"
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Restore workspace cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            packages/*/dist
            apps/*/build
          key: workspace-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.event.workflow_run.head_sha }}
          restore-keys: |
            workspace-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Setup Python venv for lizard
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv --python 3.10 packages/lizard-ts/.venv
          VIRTUAL_ENV=packages/lizard-ts/.venv uv pip install -r packages/lizard-ts/requirements.txt

      # Fallback: install if cache miss
      - name: Install dependencies (if needed)
        run: pnpm install --frozen-lockfile

      # Now Turbo can use its cache effectively
      - name: Run ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}

      - name: Build Storybook (charts import validation)
        if: matrix.task == 'lint'
        run: cd packages/charts && bun run build-storybook

      # Upload coverage only for test job
      - name: Upload coverage artifacts
        if: matrix.task == 'test:coverage'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            packages/*/coverage/lcov.info
            apps/*/coverage/lcov.info
          retention-days: 1

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/master'
    strategy:
      matrix:
        project:
          - { name: "webapp", path: "apps/webapp" }
          - { name: "behave", path: "packages/behave" }
          - { name: "lib", path: "packages/lib" }
          - { name: "code-maat-port", path: "packages/code-maat-port" }
          - { name: "charts", path: "packages/charts" }
          - { name: "lizard-ts", path: "packages/lizard-ts" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check if project has changes
        id: changes
        run: |
          if git diff --name-only HEAD~1...HEAD | grep -q "^${{ matrix.project.path }}/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore Turbo cache
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Restore workspace cache
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            packages/*/dist
            apps/*/build
          key: workspace-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.event.workflow_run.head_sha }}
          restore-keys: |
            workspace-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Download coverage artifacts
        if: steps.changes.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: SonarQube Scan - ${{ matrix.project.name }}
        if: steps.changes.outputs.changed == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          projectBaseDir: ${{ matrix.project.path }}/
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: >
            -Dsonar.log.level=WARN
