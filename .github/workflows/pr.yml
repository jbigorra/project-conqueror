name: PR Pipeline

on:
  pull_request:

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Enable Corepack
        run: corepack enable

      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', 'turbo.json', '**/bunup.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python venv for lizard
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv --python 3.10 packages/lizard-ts/.venv
          VIRTUAL_ENV=packages/lizard-ts/.venv uv pip install -r packages/lizard-ts/requirements.txt

      - name: Build with Turbo
        run: pnpm run build

      - name: Cache workspace
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            packages/*/dist
            apps/*/build
          key: workspace-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}

  quality:
    name: Lint and Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Python venv for lizard
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv --python 3.10 packages/lizard-ts/.venv
          VIRTUAL_ENV=packages/lizard-ts/.venv uv pip install -r packages/lizard-ts/requirements.txt

      - name: Restore workspace cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            packages/*/dist
            apps/*/build
          key: workspace-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            workspace-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', 'turbo.json', '**/bunup.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies (if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Lint with Biome
        run: pnpm run lint

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Build Storybook (charts import validation)
        run: cd packages/charts && bun run build-storybook

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pr-coverage
          path: |
            packages/*/coverage/lcov.info
            apps/*/coverage/lcov.info
          retention-days: 1

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        project:
          - { name: "webapp", path: "apps/webapp" }
          - { name: "behave", path: "packages/behave" }
          - { name: "lib", path: "packages/lib" }
          - { name: "code-maat-port", path: "packages/code-maat-port" }
          - { name: "charts", path: "packages/charts" }
          - { name: "lizard-ts", path: "packages/lizard-ts" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if project has changes
        id: changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^${{ matrix.project.path }}/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore workspace cache
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            packages/*/dist
            apps/*/build
          key: workspace-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            workspace-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Download coverage artifacts
        if: steps.changes.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: pr-coverage

      - name: SonarQube Scan - ${{ matrix.project.name }}
        if: steps.changes.outputs.changed == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          projectBaseDir: ${{ matrix.project.path }}/
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
