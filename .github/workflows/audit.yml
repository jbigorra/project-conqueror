name: Security Audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.0.0
          cache: "pnpm"
      - name: Audit dependencies
        run: pnpm audit --audit-level high
